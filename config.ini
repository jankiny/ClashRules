[General]
; 基础设置
mixed-port=7890
allow-lan=true
log-level=info
external-controller=0.0.0.0:9090
dns-enabled=true
; 国内DNS
dns-nameserver=223.5.5.5,119.29.29.29
; 国外DNS (fallback)
dns-fallback=8.8.8.8,1.1.1.1,tls://1.0.0.1:853,tls://dns.google:853

[Rule]
; 格式：RULE-SET, 规则地址, 策略组名称

; 1. 局域网与直连规则
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/LocalAreaNetwork.yaml,🎯 全球直连
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/UnBan.yaml,🎯 全球直连
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/Ruleset/GoogleCN.yaml,🎯 全球直连
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/Ruleset/SteamCN.yaml,🎯 全球直连
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/ChinaDomain.yaml,🎯 全球直连
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/ChinaCompanyIp.yaml,🎯 全球直连

; 2. 广告拦截
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/BanAD.yaml,🛑 广告拦截
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/BanProgramAD.yaml,🍃 应用净化

; 3. 特定应用分流
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/Ruleset/GoogleFCM.yaml,📢 谷歌FCM
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/Ruleset/Microsoft.yaml,Ⓜ️ 微软服务
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/Ruleset/Apple.yaml,🍎 苹果服务
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/Ruleset/Telegram.yaml,📲 电报消息
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/ProxyMedia.yaml,🌍 国外媒体

; 4. 长风网站/漏网之鱼
DOMAIN-SUFFIX,v2rayse.com,🚀 节点选择
DOMAIN-SUFFIX,cff.pw,🚀 节点选择
DOMAIN-SUFFIX,vpnse.org,🚀 节点选择
DOMAIN-SUFFIX,cfmem.com,🚀 节点选择
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@release/American.list.yaml,🚀 节点选择
RULE-SET,https://fastly.jsdelivr.net/gh/jankiny/ClashRules@acl4ssr/ProxyLite.yaml,🚀 节点选择

; 5. 兜底规则
GEOIP,CN,🎯 全球直连
MATCH,🐟 漏网之鱼

[Proxy Group]
; 🚀 节点选择 (主策略)
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🏳️‍⚧️ 自建节点`[]DIRECT`.*

; ♻️ 自动选择 (测速)
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300

; 🏳️‍⚧️ 自建节点 (你现在的单一节点会自动进这里，因为下面用了 .*)
custom_proxy_group=🏳️‍⚧️ 自建节点`select`.*

; 其他策略组 (按照你的习惯保留)
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]♻️ 自动选择`.*
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`.*
custom_proxy_group=🎥 奈飞视频`select`[]🚀 节点选择`[]♻️ 自动选择`.*
custom_proxy_group=📺 哔哩哔哩`select`[]🎯 全球直连`[]🇭🇰 香港节点`.*
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`.*
custom_proxy_group=🌏 国内媒体`select`[]DIRECT`[]🇭🇰 香港节点`.*
custom_proxy_group=📢 谷歌FCM`select`[]DIRECT`[]🚀 节点选择`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`.*
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`.*
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`.*
custom_proxy_group=🎶 网易音乐`select`[]DIRECT`[]🚀 节点选择`.*

; 功能组
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT

; 预留地区分组
; 这里用了简单的正则：包含 HK 或 香港 字眼的自动进香港组
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)(HK|Hong|香港)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🇺🇲 美国节点`url-test`(?i)(US|America|美国)`http://www.gstatic.com/generate_204`300
